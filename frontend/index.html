<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYOSEE</title>

    <!--
      The typefaces the theme has always named but never fetched. Fira Code was
      listed in tailwind.config.js from the start and nothing ever loaded it, so
      every page has been falling back to the system default.

      Plus Jakarta Sans is the interface face: warm, slightly rounded, and it
      holds up at the small sizes a problem list is full of. Fira Code is for
      code and for anything that has to line up in columns.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      The theme, applied before anything is painted.

      React cannot do this: by the time the bundle has parsed and mounted, the
      browser has already drawn a white page, and a dark-mode user gets a
      flash of white on every single load. It is a handful of lines inline in
      the document head instead, running before the first byte of CSS is
      applied.

      It must agree with ThemeContext exactly — same key, same order of
      precedence — or the page would correct itself a frame later, which is
      the flash this exists to prevent.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("oj_theme");
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
