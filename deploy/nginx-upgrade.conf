# $connection_upgrade, which nginx does not define by itself.
#
# It must be "upgrade" for a websocket handshake and "close" otherwise, and it
# belongs in the http block rather than a server block — which is why it is a
# separate file mounted into /etc/nginx/conf.d is NOT enough on its own: this
# one is included from the main nginx.conf's http context by the image's own
# conf.d include, which sits inside http. That is where map is legal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
