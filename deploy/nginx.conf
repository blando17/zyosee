# One port for everything.
#
# WHY A PROXY RATHER THAN THREE OPEN PORTS
#
# Exposing 5001 and 8000 directly would work and is simpler to debug, at the
# cost of three security-group rules, three public ports, and cross-origin
# requests from the page to both of them. Behind this proxy the browser only
# ever talks to one origin on port 80, so there is no CORS at all and one
# inbound rule to get right instead of three.
server {
    listen 80;
    server_name _;

    # Submitted source, problem statements and test payloads are all larger
    # than nginx's 1 MB default, which would reject them as 413 with nothing
    # in the browser console explaining why.
    client_max_body_size 24m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------ accounts API --
    #
    # The trailing slash on proxy_pass is load-bearing: with it, /auth/login
    # reaches the backend as /login. Without it the backend would see
    # /auth/login and answer 404 for every route.
    #
    # This block also carries the websockets. Pair Lab and the Duel Arena both
    # upgrade through here, which is why the Upgrade and Connection headers
    # are set — without them nginx silently downgrades the handshake to a
    # plain request and the socket closes immediately.
    location /auth/ {
        proxy_pass http://backend:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A socket with nothing to say must not be cut off. The default 60s
        # would drop an idle Pair Lab room every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------- compiler and judge --
    #
    # A submission may be judged inline when Redis is unavailable, and that
    # path holds the connection for the whole 30-second budget. The default
    # 60s read timeout is enough, but only just, so it is raised deliberately.
    location /judge/ {
        proxy_pass http://compiler:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------- the app ----
    location / {
        root /usr/share/nginx/html;
        # Hashed filenames, so these can be cached hard and for ever.
        location ~* \.(js|css|woff2?|png|jpe?g|webp|svg)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        # Client-side routing: every unknown path is the app's own, not a 404.
        try_files $uri /index.html;
    }
}
